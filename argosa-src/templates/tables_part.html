<style>

  .minicards { display:flex; gap:8px; margin-top:6px; }

  details.full { margin-top:18px; }

  .tlog ol { margin:0; padding-left:1.5em; } .tlog li { padding:3px 0; } .tlog li b { color:var(--fg); font-weight:normal; }
  .empty { color:var(--muted); font-style:italic; padding:16px 4px; }
  /* character sheet */
  .csel { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; font:inherit; font-size:16px; padding:9px 10px; min-height:44px; }
  .cname { font-size:1.5rem; margin:14px 0 2px; }
  .cline { color:var(--muted); font-size:.9rem; }
  .cline b { color:var(--fg); font-weight:normal; }
  .chead { color:var(--accent); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; margin:18px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
  .chead button { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; font:inherit; font-size:.75rem; padding:5px 10px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .chead button.on { background:#3a2c20; color:var(--fg); }
  .attrs { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
  @media (min-width:560px) { .attrs { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px; } }
  .attr { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
  .attr.sel { border-color:var(--accent); background:#2a211b; }

  .attr .an small { display:block; color:var(--muted); font-size:.7rem; }
  .attr button { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--fg); font-size:1rem; cursor:pointer; flex:none; }
  .attr .av { min-width:2em; text-align:center; font-size:1.25rem; font-variant-numeric:tabular-nums; }
  .attr .am { min-width:2.2em; text-align:right; color:var(--accent); font-size:.9rem; }
  .derived { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .dstat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
  .dstat small { display:block; color:var(--muted); font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; }
  .dstat span { font-size:1.15rem; }
  .clist { margin:0; padding-left:1.2em; line-height:1.55; }
  .cweps { display:grid; gap:6px; margin:4px 0 8px; }
  .cwep { line-height:1.4; }
  .cwep > span { margin-left:6px; white-space:nowrap; }
  .pgattrs { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:6px 0; }
  .pgtext { line-height:1.5; }
  .pgimg { width:100%; height:auto; border-radius:8px; margin-top:8px; border:1px solid var(--line); }
  a.pglink { display:inline-block; background:var(--accent); color:#1b140e; border-radius:999px; padding:10px 18px; text-decoration:none; margin:8px 0 4px; }
  .clist li { padding:2px 0; }
  details.ab { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  details.ab summary { cursor:pointer; }
  details.ab .cell { margin-top:6px; font-size:.92rem; }
  .cnote { color:var(--muted); font-size:.8rem; line-height:1.45; margin-top:6px; }
  .chipbtn.ready { background:var(--accent); color:#1b140e; border-color:var(--accent); }
</style>

<section class="panel" id="p-tables" hidden>
  <div class="sub">Every roll table in the book, from the vault. Tap a table to roll it.</div>
  <input class="tsearch" id="tsearch" type="search" placeholder="Search tables (e.g. trauma, forest, trinkets)" autocomplete="off">
  <div id="genBox">
    <div class="glabel">Generators</div>
    <div class="gens">
      <button data-g="character"><b>&#9670;</b> Character</button>
      <button data-g="dungeon"><b>&#9670;</b> Dungeon</button>
      <button data-g="room"><b>&#9670;</b> Dungeon Room</button>
      <button data-g="lair"><b>&#9670;</b> Lair Treasure</button>
      <button data-g="item"><b>&#9670;</b> Major Magic Item</button>
      <button data-g="hireling"><b>&#9670;</b> Hireling</button>
    </div>
  </div>
  <div id="tindex"></div>
  <div class="tlog" id="tlogBox" hidden><h2>Past rolls</h2><ol id="tlog" reversed></ol></div>
</section>

<div class="sheet" id="sheet">
  <div class="shead"><button class="sback" id="sheetBack" aria-label="Back">&#8592;</button><div class="stitle" id="stitle"></div></div>
  <div class="sbody" id="sbody"></div>
</div>

<script>
{
const TABLES = /*TABLES_JSON*/[];
const byId = Object.fromEntries(TABLES.map(t => [t.id, t]));
const byTitle = Object.fromEntries(TABLES.map(t => [t.title.toLowerCase(), t]));
const $ = id => document.getElementById(id);
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const b = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(b); } while (b[0] >= lim);
    return b[0] % n + 1;
  }
  return Math.floor(Math.random() * n) + 1;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };
const T = t => byTitle[t.toLowerCase()];

// ---------- dice ----------
function rollExpr(e) {           // "3d6", "1d6+1", "10x1d100", "1d6x10", "1d4-1"
  const m = e.match(/^(?:(\d+)x)?(\d+)d(\d+)(?:([+-])(\d+))?(?:x(\d+))?$/);
  if (!m) return null;
  const n = +m[2], s = +m[3], dice = [];
  for (let i = 0; i < n; i++) dice.push(rnd(s));
  let tot = dice.reduce((a, b) => a + b, 0);
  if (m[4]) tot += (m[4] === '+' ? 1 : -1) * (+m[5]);
  if (m[1]) tot *= +m[1];
  if (m[6]) tot *= +m[6];
  return { total: tot, dice };
}
// Per-table roll rules the header alone can't express
const OVERRIDE = { 'spell like blessings': { expr: '1d6+6', label: '1d6+6 (results 7-12 of the Blessings d12)' } };
function dieRoll(t, opt) {
  const o = OVERRIDE[t.title.toLowerCase()];
  if (o && !opt.die) { const r = rollExpr(o.expr); return { v: r.total, label: o.label }; }
  let d = opt.die || t.die;
  if (d === 'd4/d12') d = opt.gear === 'nc' ? 'd4' : 'd12';
  let v, label = d;
  if (d === 'd66') { const a = rnd(6), b = rnd(6); v = a * 10 + b; label = 'd66 (' + a + ', ' + b + ')'; }
  else if (d === '2d6') { const a = rnd(6), b = rnd(6); v = a + b; label = '2d6 (' + a + '+' + b + ')'; }
  else { const s = +d.slice(1); v = rnd(s); if (s === 100 && v === 100) label = 'd100 (00)'; }
  if (opt.mod) { v += opt.mod; label += (opt.mod > 0 ? ' +' : ' ') + opt.mod; }
  return { v, label };
}
function findRow(t, v) {
  const rs = t.rows.filter(r => r.lo !== null);
  let r = rs.find(r => v >= r.lo && v <= r.hi);
  if (r) return { r, note: '' };
  const lo = Math.min(...rs.map(r => r.lo)), hi = Math.max(...rs.map(r => r.hi === 999 ? r.lo : r.hi));
  if (v > hi) return { r: rs.reduce((a, b) => (b.lo > a.lo ? b : a)), note: 'above the table: highest row used' };
  if (v < lo) return { r: rs.reduce((a, b) => (b.lo < a.lo ? b : a)), note: 'below the table: lowest row used' };
  return { r: null, note: 'the book prints no entry for ' + v };
}

// ---------- rendering ----------
const isNamedCol = h => plain(h) !== '';
function rowHtml(t, r, colFilter) {
  if (!r) return '<div class="cell"><i>No entry.</i></div>';
  const named = t.header.slice(1).some(isNamedCol);
  return r.c.map((c, i) => {
    if (colFilter != null && colFilter !== i) return '';
    const lab = named && isNamedCol(t.header[i + 1]) ? '<span class="clabel">' + t.header[i + 1] + '</span>' : '';
    return '<div class="cell">' + lab + addListChip(c) + '</div>';
  }).join('') + footFor(t, r);
}
function footFor(t, r) {          // a result that cites a footnote (sup 1) carries that footnote with it
  const sups = new Set(); r.c.join(' ').replace(/<sup>(\d+)<\/sup>/g, (m, n) => sups.add(n));
  if (!sups.size) return '';
  return t.post.filter(p => { const m = p.match(/^<sup>(\d+)<\/sup>/); return m && sups.has(m[1]); })
    .map(p => '<div class="cell foot">' + p + '</div>').join('');
}
function addListChip(c) {          // a cell that lists options with no die of its own gets one
  if (!/class="op"/.test(c)) return c;
  const d = document.createElement('div'); d.innerHTML = c;
  const ops = [...d.querySelectorAll('.op')];
  const first = ops[0]; let hasDie = false;
  d.querySelectorAll('.dx').forEach(x => { if (x.compareDocumentPosition(first) & Node.DOCUMENT_POSITION_FOLLOWING) hasDie = true; });
  if (hasDie) return c;
  const n = Math.max(...ops.map(o => +o.dataset.hi));
  return '<span class="dx" data-e="1d' + n + '">roll 1d' + n + '</span> ' + c;
}
function cardHtml(t, r, rollLabel, v, note, colFilter) {
  return '<div class="rcard latest"><div class="rhead"><span>' + esc(t.title) + (rollLabel ? ' &middot; ' + esc(rollLabel) : '') +
    (note ? ' &middot; <i>' + esc(note) + '</i>' : '') + '</span>' +
    (v != null ? '<span class="rv">' + (r ? r.k : v) + (r && String(v) !== plain(r.k) ? ' <small>(' + v + ')</small>' : '') + '</span>' : (r ? '<span class="rv">' + r.k + '</span>' : '')) +
    '</div>' + rowHtml(t, r, colFilter) + '</div>';
}
function nestHtml(t, r, rollLabel, v, note) {
  return '<div class="nest"><div class="nh"><b>' + esc(t.title) + '</b>' + (rollLabel ? ' &middot; ' + esc(rollLabel) : '') +
    ' &middot; ' + (r ? r.k : '') + (note ? ' &middot; <i>' + esc(note) + '</i>' : '') + '</div>' + rowHtml(t, r) + '</div>';
}
function rollOnce(t, opt = {}) {
  if (t.lookup) { const r = t.rows[rnd(t.rows.length) - 1]; return { r, label: 'random row', v: null, note: '' }; }
  const d = dieRoll(t, opt);
  const f = findRow(t, d.v);
  return { r: f.r, label: d.label, v: d.v, note: f.note };
}

// ---------- log ----------
function logIt(title, text) {
  const li = document.createElement('li');
  li.innerHTML = '<b></b> - <span></span>';
  li.querySelector('b').textContent = title;
  li.querySelector('span').textContent = text.length > 110 ? text.slice(0, 107) + '...' : text;
  $('tlog').prepend(li); $('tlogBox').hidden = false;
}

// ---------- interactions inside results (event delegation) ----------
function afterCell(el) { return el.closest('.cell') || el.closest('.nest') || el.closest('.rcard') || el.parentElement; }
function insertNest(el, html) {
  const cell = afterCell(el);
  const holder = document.createElement('div'); holder.innerHTML = html;
  const n = holder.firstElementChild;
  // put nested results after the cell, in click order
  let anchor = cell; while (anchor.nextElementSibling && anchor.nextElementSibling.classList.contains('nest')) anchor = anchor.nextElementSibling;
  anchor.after(n);
  return n;
}
function depthOf(el) { let d = 0, p = el; while (p) { if (p.classList && p.classList.contains('nest')) d++; p = p.parentElement; } return d; }
function highlightOps(chip, v) {
  const cell = chip.closest('.cell') || chip.parentElement;
  const ops = [...cell.querySelectorAll('.op')].filter(o => chip.compareDocumentPosition(o) & Node.DOCUMENT_POSITION_FOLLOWING);
  if (!ops.length) return;
  // only the first run of options after the chip (until a gap in numbering restarts)
  const run = [ops[0]];
  for (let i = 1; i < ops.length; i++) { if (+ops[i].dataset.lo <= +run[run.length - 1].dataset.lo) break; run.push(ops[i]); }
  run.forEach(o => o.classList.toggle('hit', v >= +o.dataset.lo && v <= +o.dataset.hi));
}
document.addEventListener('click', e => {
  const el = e.target.closest('.dx, .pc, .tr, .bo, .sg');
  if (!el || !el.closest('#sheet, #p-tables')) return;
  e.preventDefault();
  if (el.classList.contains('dx')) {
    const base = el.dataset.base || el.textContent; el.dataset.base = base;
    const r = rollExpr(el.dataset.e); if (!r) return;
    el.innerHTML = esc(base) + ' &#8594; <span class="out">' + r.total + '</span>';
    el.dataset.last = r.total;
    highlightOps(el, r.total);
  } else if (el.classList.contains('pc')) {
    const base = el.dataset.base || el.textContent; el.dataset.base = base;
    const v = rnd(100), ok = v <= +el.dataset.p;
    el.innerHTML = esc(base) + ' &#8594; <span class="out">' + (ok ? 'yes' : 'no') + '</span> (' + v + ')';
  } else if (el.classList.contains('bo')) {
    const base = el.dataset.base || el.textContent; el.dataset.base = base;
    const b = window.castBonesQuick('even');
    el.innerHTML = esc(base) + ' &#8594; <span class="out">' + esc(b.text) + '</span>';
  } else if (el.classList.contains('sg')) {
    if (depthOf(el) > 5) return;
    const [a, b] = window.drawTwo();
    insertNest(el, '<div class="nest"><div class="nh"><b>Read the Signs</b> &middot; ' + esc(a.name) + ' + ' + esc(b.name) + '</div><div class="minicards">' +
      [a, b].map(c => '<figure><img alt="" src="' + c.src + '">' + esc(c.name) + '</figure>').join('') + '</div></div>');
  } else if (el.classList.contains('tr')) {
    if (depthOf(el) > 5) return;
    const tid = el.dataset.t, t0 = byId[tid];
    const sec = tid.startsWith('__SEC:') ? tid.slice(6) : null;
    const pageRef = /^p\.\s?\d+$/.test(el.textContent.trim());
    // "the relevant terrain" / a page reference to the encounter tables -> choose the terrain
    if (tid === '__ENC' || sec === '17.5' || (t0 && t0.num.startsWith('17.5.') && pageRef && !el.dataset.r)) { insertNest(el, '<div class="nest">' + encounterPicker() + '</div>'); return; }
    if (sec) {                                  // a rules section that owns several roll tables
      const ts = TABLES.filter(x => x.num.startsWith(sec + '.'));
      if (ts.length === 1) { const o = rollOnce(ts[0]); insertNest(el, nestHtml(ts[0], o.r, o.label, o.v, o.note)); logIt(ts[0].title, o.r ? plain(o.r.c.join(' / ')) : o.note); return; }
      insertNest(el, '<div class="nest"><div class="nh"><b>Choose a table</b></div><div class="hdpick">' + ts.map(x => '<button class="chipbtn" data-enc="' + x.id + '">' + esc(x.title) + '</button>').join('') + '</div></div>');
      return;
    }
    const t = t0; if (!t) return;
    if (el.dataset.r) {
      const v = +el.dataset.r, f = findRow(t, v);

function monsterFor(hdText) {           // "HD 9-10", "HD 11+" -> a Monsters by HD row + a monster from its list

  if (!rows.length) return '';

  const d = document.createElement('div'); d.innerHTML = r.c[0];

const GENS = {

function lairRoll(i) {
